jdk:
  - openjdk11

before_install:
  - rm -f pom.xml

install:
  - export OWNER=p-hoffmann REPO=trexsql-java VER=${VERSION:-v0.1.3} && mkdir -p ~/.m2/repository/com/github/${OWNER}/${REPO}/${VER}
  - export OWNER=p-hoffmann REPO=trexsql-java VER=${VERSION:-v0.1.3} && curl -L -o ~/.m2/repository/com/github/${OWNER}/${REPO}/${VER}/${REPO}-${VER}.jar https://github.com/${OWNER}/${REPO}/releases/download/${VER}/trexsql-${VER#v}.jar
  - |
    export OWNER=p-hoffmann REPO=trexsql-java VER=${VERSION:-v0.1.3}
    cat > ~/.m2/repository/com/github/${OWNER}/${REPO}/${VER}/${REPO}-${VER}.pom << EOFPOM
    <?xml version="1.0" encoding="UTF-8"?>
    <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
      <modelVersion>4.0.0</modelVersion>
      <groupId>com.github.${OWNER}</groupId>
      <artifactId>${REPO}</artifactId>
      <version>${VER}</version>
      <packaging>jar</packaging>
    </project>
    EOFPOM
